[Window]
width=1280
height=720
xstart=100
ystart=100
title=YELLOWTEAMGAME

[Shaders]
vertex=shaders/LevelVertex.hlsl
pixel=shaders/LevelPixel.hlsl

[Content]
level=assets/levels/prototype.json
models=assets/models

; Fixed preview camera: identity orientation, looking along +Z, Y up.
[PreviewCamera]
x=0
y=2
z=-10

; Exact Blender object names select the existing dynamic templates.
[Player]
model=Player
health=100
speed=5
damage=25
range=1.5
cooldown=0.5

[Enemy]
model=Enemy
health=100
speed=3
damage=10
range=1.2
cooldown=1

; Fixed offset from the player, Y up; perspective comes from the existing renderer.
[GameplayCamera]
x=8
y=12
z=-10
