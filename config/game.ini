[Window]
width=1280
height=720
xstart=100
ystart=100
title=Carcosa

[Shaders]
vertex=shaders/LevelVertex.hlsl
pixel=shaders/LevelPixel.hlsl

[Content]
level=assets/levels/Level1.json
models=assets/models

; Fixed preview camera: identity orientation, looking along +Z, Y up.
[PreviewCamera]
x=0
y=2
z=-10

; Exact Blender object names select the existing dynamic templates.
[Player]
model=Warrior
health=250
speed=5
damage=25
range=5.0
cooldown=0.5

[Enemy]
model=Enemy
health=100
speed=3
damage=10
range=1.2
cooldown=1

[UndeadKnight]
model = UndeadKnight
health = 600
speed = 2
damage = 35
range = 1
cooldown = 1.5 
summonCD = 5;
squireMin = 4;
squireMax = 10;
spawnRadius = 5;

[Squire]
model = Squire
health = 50
speed = 3
damage = 5
range = .5
cooldown = .5


; Exact dynamic Blender object name; initialization waits for its exported content.
[VampireQueen]
model = VampireCleric
health = 500
speed=3
damage=20
range=1.2
cooldown=1
drainDamage=20
; Fraction of actual damage dealt restored as health.
drainLifeSteal=0.5
drainRange=5
drainCooldown=4

; Ring follows the living Player in X/Z; height/orientation come from the Enemy placement.
; totalSpawnLimit=0 means unlimited. The original Enemy counts toward maximumAlive.
[HordeSpawner]
enabled=true
spawnInterval=2
minimumRadius=4
maximumRadius=7
maximumAlive=5
totalSpawnLimit=0
; Relative non-boss spawn weights; zero disables a variant. At least one must be positive.
meleeWeight=1
rangedWeight=1
wizardWeight=1

; Per-instance emissive flash, RGB channels in [0,1]; seconds, restart after each hit.
[DamageFeedback]
enabled=true
duration=0.12
flashR=1.0
flashG=1.0
flashB=1.0

; Near-top-down follow, Y up. Keep a nonzero X/Z offset for stable LookAt orientation.
; Higher Y or smaller X/Z steepens the angle; larger offsets show more ground.
[GameplayCamera]
x=0
y=18
z=-4

; Extra X/Z collection distance added to the player's supplied radius, in world units.
[Pickup]
collectionAllowance=0.5

; Exact dynamic Blender template names; distances are X/Z world units.
[DungeonKey]
model=Key
level=1
pickupRadius=1.5
distToUse=2.5

[DungeonExit]
model=ArchDoor

; Player circle radius in world units on the X/Z plane.
[Collision]
playerRadius=0.5

; Visual Y offset from the target placement, not its visible feet. Both Level1 rooms
; have floor tops up to +0.125164; PurpleSpellEffect extends 0.0375 below its origin.
[WizardWarning]
heightOffset=0.18

; Menu presentation is loaded once at startup. All keys below are required; no C++ fallbacks.
; RGB colors use normalized components from 0 to 1. No art/font assets are required.
[MenuTheme]
background=0.062745098,0.066666667,0.058823529
parchment=0.106,0.102,0.082
brass=0.545,0.475,0.310
gold=0.761,0.643,0.361
highlight=0.894,0.792,0.514
text=0.867,0.824,0.710
mutedText=0.604,0.565,0.467
danger=0.573,0.235,0.220
button=0.157,0.141,0.098
buttonHovered=0.235,0.204,0.125
buttonActive=0.125,0.110,0.071

; Dimensions are pixels at the existing 1280x720 reference size, scaled to the window.
; Ranges: panelWidth 520-800; buttonWidth 160-440; buttonHeight 36-60; spacing 8-20.
; Font ranges: main title 24-80; heading 20-48; subtitle/footer 10-18; button 12-26.
[MenuLayout]
panelWidth=660
buttonWidth=260
buttonHeight=52
buttonSpacing=14
mainTitleSize=72
headingSize=42
subtitleSize=14
footerSize=13
buttonTextSize=20

; Labels change only presentation; button actions remain defined in C++.
[MainMenu]
subtitle=T H E   K I N G   I N   Y E L L O W
title=CARCOSA
tagline=BEYOND THE SHORES OF HALI
footer=THE PLAY HAS ALREADY BEGUN
startLabel=Start
quitLabel=Quit

[PauseMenu]
subtitle=A N   I N T E R M I S S I O N
title=THE CURTAIN WAITS
tagline=C A R C O S A
footer=THE PLAY IS NOT YET OVER
resumeLabel=Resume
mainMenuLabel=Main Menu
quitLabel=Quit

[GameOverMenu]
subtitle=T H E   F I N A L   A C T
title=GAME OVER
tagline=C A R C O S A
footer=EVEN NOW, THE KING REMEMBERS
mainMenuLabel=Main Menu
restartLabel=Restart

[VictoryMenu]
subtitle=T H E   C U R T A I N   F A L L S
title=Dungeon Complete!
tagline=C A R C O S A
footer=BEYOND THE GATE, CARCOSA ENDURES
mainMenuLabel=Main Menu
restartLabel=Restart
